
name: BCA CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Automated Tests
        run: python -m pytest -v

      - name: Build Docker Image
        run: docker build -t bca-cicd-monitoring:v1 .

      - name: Run Application Container
        run: docker run -d --name bca-cicd-test -p 5001:5001 bca-cicd-monitoring:v1

      - name: Verify Application Health
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5001/health; then
              echo "Application health check passed"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done

          echo "Health check failed"
          docker logs bca-cicd-test
          exit 1

      - name: Stop Test Container
        if: always()
        run: docker rm -f bca-cicd-test || true
